# Homography calibration points for Bird's-Eye View transformation
# These points define the perspective transformation from camera view to top-down view

# Source points: 4 corners of a trapezoid in the original camera image
# Order: Top-Left, Top-Right, Bottom-Right, Bottom-Left
# Camera resolution: 1920x1080 (TurtleBot3 Waffle in Gazebo)
# Adjusted for forward-looking camera with lines on ground
#
# The camera looks forward, so:
# - Top of trapezoid = far from robot (where lines converge)
# - Bottom of trapezoid = close to robot (bottom of image)
#
# For 1920x1080 image:
# - Horizon is around y=540 (middle)
# - Road visible from y=600 to y=1080

source_points:
  - [660.0, 650.0]   # Top-Left (far road - where lines converge)
  - [1260.0, 650.0]  # Top-Right
  - [1800.0, 1050.0] # Bottom-Right (close to robot - near bottom edge)
  - [120.0, 1050.0]  # Bottom-Left

# Destination points: 4 corners of a rectangle in the bird's-eye view
# Order: Top-Left, Top-Right, Bottom-Right, Bottom-Left
# Output is 640x480
destination_points:
  - [120.0, 0.0]     # Top-Left
  - [520.0, 0.0]     # Top-Right
  - [520.0, 480.0]   # Bottom-Right
  - [120.0, 480.0]   # Bottom-Left
