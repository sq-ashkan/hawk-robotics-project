# Real Robot Line Follower Configuration
# TurtleBot3 Waffle - Continuous proportional control
# White lines on dark/blue floor, binary threshold detection

# Continuous Controller Parameters
control:
  forward_speed: 0.02              # m/s constant forward speed
  angular_gain: 0.2                # steering gain: angular = -offset * gain
  max_angular: 0.3                 # max angular velocity (rad/s)

# Safety Parameters
safety:
  max_no_line_count: 20            # frames without line before stopping

# Debug and Logging
debug:
  publish_debug_images: true
  log_frequency: 30                # log every N frames
  save_interval: 30                # save debug image every N frames

# Camera Configuration
camera:
  topic: "/camera/image_raw"
  qos_depth: 20

# Topics
topics:
  cmd_vel: "/cmd_vel"
  camera_detection: "/camera/line_detection"
